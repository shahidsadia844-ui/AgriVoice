<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2D6A4F;
            --accent-green: #52B788;
            --dark-bg: #0B1912;
            --card-bg: rgba(255, 255, 255, 0.07);
            --input-bg: rgba(255, 255, 255, 0.08);
            --text-light: #F4F7F5;
            --text-muted: #B0C4B1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            color: var(--text-light);
        }

        .forgot-container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 2.5rem 2rem 5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        .lock-icon {
            width: 80px;
            height: 80px;
            border: 2px solid var(--text-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .lock-icon svg { width: 40px; height: 40px; fill: white; }
        h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.8rem; }
        p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 1.5rem; }

        .input-group { margin-bottom: 1rem; }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
        }
        input:focus { border-color: var(--accent-green); }

        .btn-send {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #52B788, #2D6A4F);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-send:hover { opacity: 0.92; transform: translateY(-1px); }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 1.5rem 0;
            position: relative;
        }
        .divider span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #143024;
            padding: 0 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .secondary-link {
            font-size: 0.82rem;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            display: block;
        }

        .back-to-login {
            background: rgba(0,0,0,0.18);
            width: 100%;
            padding: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
        }

        /* Custom In-App Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 25, 18, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }
        .modal-card {
            background: rgba(27, 67, 50, 0.95);
            border: 1px solid var(--accent-green);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 1.8rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }
        .modal-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(82, 183, 136, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-size: 1.5rem;
        }
        .modal-card h3 { font-size: 1.15rem; color: #fff; }
        .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
        .modal-btn {
            width: 100%;
            margin-top: 0.6rem;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            background: var(--accent-green);
            color: #0B1912;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="forgot-container">
        <div class="lock-icon">
            <svg viewBox="0 0 24 24"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15C10,13.89 10.9,13 12,13M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.9 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/></svg>
        </div>
        <h2>Trouble logging in?</h2>
        <p>Enter your email or phone number and we'll send you a link to get back into your account.</p>

        <form id="resetForm">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Email or Phone Number" required autocomplete="off">
            </div>
            <button type="submit" class="btn-send">Send login link</button>
        </form>

        <div class="divider"><span>OR</span></div>
        <a href="03_signup.html" class="secondary-link">Create new account</a>
        
        <div style="margin-top: 1.5rem;">
            <a href="#" class="secondary-link" onclick="showSupportModal()" style="font-weight: 500; font-size: 0.76rem; color: var(--accent-green);">Can't reset your password?</a>
        </div>

        <a href="02_signin.html" class="back-to-login">Back to login</a>
    </div>

    <!-- Website Status Popup (replaces browser alert) -->
    <div class="modal-overlay" id="statusModal">
        <div class="modal-card">
            <div class="modal-badge" id="modalBadge">✓</div>
            <h3 id="modalHeading">Link Dispatched</h3>
            <p id="modalMessage">Success! A reset link has been sent to your address.</p>
            <button class="modal-btn" id="modalConfirmBtn" onclick="confirmModalAction()">Continue to Sign In</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        let isSuccess = false;

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('userInput').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^(\+923\d{8}|03\d{9})$/;

            const modal = document.getElementById('statusModal');
            const badge = document.getElementById('modalBadge');
            const heading = document.getElementById('modalHeading');
            const msg = document.getElementById('modalMessage');
            const btn = document.getElementById('modalConfirmBtn');

            if (emailRegex.test(val) || phoneRegex.test(val)) {
                isSuccess = true;
                badge.innerText = "✓";
                badge.style.color = "var(--accent-green)";
                badge.style.background = "rgba(82, 183, 136, 0.2)";
                heading.innerText = "Link Sent Successfully";
                msg.innerText = `A recovery link have been sent to ${val}.`;
                btn.innerText = "Proceed to Sign In";
            } else {
                isSuccess = false;
                badge.innerText = "!";
                badge.style.color = "#EF4444";
                badge.style.background = "rgba(239, 68, 68, 0.2)";
                heading.innerText = "Invalid Credentials";
                msg.innerText = "Please enter a valid email address or Pakistani mobile number (03XXXXXXXXX).";
                btn.innerText = "Try Again";
            }
            modal.style.display = 'flex';
        });

        function confirmModalAction() {
            const modal = document.getElementById('statusModal');
            if (isSuccess) {
                window.location.href = '02_signin.html';
            } else {
                modal.style.display = 'none';
            }
        }

        function showSupportModal() {
            const modal = document.getElementById('statusModal');
            const badge = document.getElementById('modalBadge');
            const heading = document.getElementById('modalHeading');
            const msg = document.getElementById('modalMessage');
            const btn = document.getElementById('modalConfirmBtn');

            isSuccess = false;
            badge.innerText = "☎";
            badge.style.color = "var(--accent-green)";
            badge.style.background = "rgba(82, 183, 136, 0.2)";
            heading.innerText = "AgriPak Help Desk";
            msg.innerHTML = "WhatsApp: <b>+92 315 4357546</b><br>Email: <b>support@agripak.com</b>";
            btn.innerText = "Close";
            modal.style.display = 'flex';
        }
    </script>
</body>
</html>
