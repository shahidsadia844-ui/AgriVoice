<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - Mandi Rates</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2D6A4F;
            --accent-green: #52B788;
            --dark-bg: #0B1912;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #F4F7F5;
            --text-muted: #B0C4B1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            padding: 1.2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Top Navigation Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            backdrop-filter: blur(12px);
        }

        .back-btn svg { width: 22px; height: 22px; fill: #fff; }

        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Search & Filter Section */
        .search-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 0.9rem;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* Mandi Category Pills */
        .category-scroll {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 0.2rem;
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: var(--accent-green);
            color: #0B1912;
            font-weight: 700;
            border-color: var(--accent-green);
        }

        /* Mandi Rate Cards */
        .rates-list {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .rate-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .crop-info h3 {
            font-size: 1rem;
            font-weight: 700;
        }

        .crop-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .price-info {
            text-align: right;
        }

        .price-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .price-change {
            font-size: 0.72rem;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .up { color: #52B788; }
        .down { color: #EF4444; }

        .city-row {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .city-row .city-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .city-distance {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Top Navigation -->
        <div class="top-nav">
            <!-- Link Back to Dashboard (05_dashboard.html) -->
            <a href="05_dashboard.html" class="back-btn" title="Back to Dashboard">
                <svg viewBox="0 0 24 24"><path d="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/></svg>
            </a>
            <h1 class="page-title">Mandi Rates</h1>
            <div style="width: 44px;"></div>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <svg style="width:20px; height:20px; fill:var(--text-muted)" viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
            <input type="text" id="searchInput" placeholder="Search crop or city..." oninput="renderRates()">
        </div>

        <!-- Filters -->
        <div class="category-scroll" id="chipScroll">
            <div class="chip active" data-crop="all" onclick="selectChip('all')">All Crops</div>
            <div class="chip" data-crop="wheat" onclick="selectChip('wheat')">Wheat (گندم)</div>
            <div class="chip" data-crop="cotton" onclick="selectChip('cotton')">Cotton (کپاس)</div>
            <div class="chip" data-crop="maize" onclick="selectChip('maize')">Maize (مکئی)</div>
            <div class="chip" data-crop="sugarcane" onclick="selectChip('sugarcane')">Sugarcane (گنا)</div>
        </div>

        <!-- Rates List -->
        <div class="rates-list" id="ratesList">
        </div>

    <div id="cityModal" style="display:none; position:fixed; inset:0; background:rgba(11,25,18,0.95); backdrop-filter:blur(20px); padding:2rem 1.5rem; z-index:2000; overflow-y:auto;">
    <div style="max-width:440px; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem;">
        <button onclick="document.getElementById('cityModal').style.display='none'" class="back-btn" style="cursor:pointer; border:none; width: fit-content; padding: 0.5rem 1rem;">← Back</button>
        <h2 id="modalTitle" style="font-size:1.3rem; color:var(--accent-green);">Rates by City</h2>
        <div class="rates-list" id="modalRatesList">
        </div>
    </div>
</div>

    </div>
    <script>
    // Default crops with per-mandi (city) rates, yesterday's change, and distance from the farm (current location)
    const cropData = {
        wheat: {
            label: "Wheat (گندم)",
            unit: "40 kg",
            cities: [
                { city: "Lahore",     price: 3950, change: 50,   distance: 5 },
                { city: "Sahiwal",    price: 3920, change: 20,   distance: 180 },
                { city: "Faisalabad", price: 3900, change: -10,  distance: 130 },
                { city: "Multan",     price: 3820, change: 30,   distance: 340 }
            ]
        },
        cotton: {
            label: "Cotton (کپاس)",
            unit: "40 kg",
            cities: [
                { city: "Multan",     price: 8500, change: 120,  distance: 340 },
                { city: "Bahawalpur", price: 8380, change: 90,   distance: 420 },
                { city: "Sahiwal",    price: 8300, change: -40,  distance: 180 },
                { city: "Rahim Yar Khan", price: 8150, change: 60, distance: 480 }
            ]
        },
        maize: {
            label: "Maize (مکئی)",
            unit: "40 kg",
            cities: [
                { city: "Sahiwal",    price: 2400, change: 0,    distance: 180 },
                { city: "Okara",      price: 2380, change: 10,   distance: 150 },
                { city: "Faisalabad", price: 2350, change: -15,  distance: 130 },
                { city: "Lahore",     price: 2320, change: 5,    distance: 5 }
            ]
        },
        sugarcane: {
            label: "Sugarcane (گنا)",
            unit: "40 kg",
            cities: [
                { city: "Faisalabad", price: 1250, change: 15,   distance: 130 },
                { city: "Sahiwal",    price: 1230, change: 0,    distance: 180 },
                { city: "Multan",     price: 1210, change: -5,   distance: 340 },
                { city: "Lahore",     price: 1190, change: 10,   distance: 5 }
            ]
        }
    };

    let activeChip = 'all';

    function formatChange(change) {
        if (change > 0) return { cls: 'up', text: `▲ +Rs. ${change} today` };
        if (change < 0) return { cls: 'down', text: `▼ -Rs. ${Math.abs(change)} today` };
        return { cls: 'up', text: `▲ Stable` };
    }

    function highestCity(crop) {
        return crop.cities.reduce((best, c) => c.price > best.price ? c : best, crop.cities[0]);
    }

    function selectChip(cropKey) {
        activeChip = cropKey;
        document.querySelectorAll('#chipScroll .chip').forEach(chip => {
            chip.classList.toggle('active', chip.dataset.crop === cropKey);
        });
        renderRates();
    }

    function renderRates() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('ratesList');
        container.innerHTML = '';

        // Build list of crops matching the active chip filter
        let entries = Object.keys(cropData)
            .filter(key => activeChip === 'all' || activeChip === key)
            .map(key => ({ key, crop: cropData[key], top: highestCity(cropData[key]) }));

        // Apply search: match crop name or any mandi (city) name
        if (query) {
            entries = entries.filter(({ key, crop }) => {
                const cropMatch = key.includes(query) || crop.label.toLowerCase().includes(query);
                const cityMatch = crop.cities.some(c => c.city.toLowerCase().includes(query));
                return cropMatch || cityMatch;
            });
        }

        // Show highest mandi rate first (sort crops by their highest price, descending)
        entries.sort((a, b) => b.top.price - a.top.price);

        if (entries.length === 0) {
            container.innerHTML = '<div class="no-results">No crops or mandis match your search.</div>';
            return;
        }

        entries.forEach(({ key, crop, top }) => {
            const changeInfo = formatChange(top.change);
            const card = document.createElement('div');
            card.className = 'rate-card';
            card.style.cursor = 'pointer';
            card.onclick = () => showCityRates(key);
            card.innerHTML = `
                <div class="crop-info">
                    <h3>${crop.label}</h3>
                    <p>${top.city} Mandi • ${crop.unit}</p>
                </div>
                <div class="price-info">
                    <div class="price-val">Rs. ${top.price.toLocaleString()}</div>
                    <div class="price-change ${changeInfo.cls}">${changeInfo.text}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function showCityRates(cropKey) {
        const crop = cropData[cropKey];
        document.getElementById('modalTitle').innerText = crop.label + " Rates by City";

        // Highest to lowest price, with distance from the farm shown below each mandi name
        const sortedCities = [...crop.cities].sort((a, b) => b.price - a.price);

        const modalList = document.getElementById('modalRatesList');
        modalList.innerHTML = sortedCities.map(c => `
            <div class="rate-card">
                <div class="city-row">
                    <div class="city-top">
                        <span>${c.city}</span>
                        <strong style="color:var(--accent-green);">Rs. ${c.price.toLocaleString()}</strong>
                    </div>
                    <span class="city-distance">${c.distance} km from farm</span>
                </div>
            </div>
        `).join('');

        document.getElementById('cityModal').style.display = 'block';
    }

    renderRates();
</script>

</body>
</html>
