<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - AI Leaf Scan</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2D6A4F;
            --accent-green: #52B788;
            --dark-bg: #0B1912;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #F4F7F5;
            --text-muted: #B0C4B1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Top Navigation Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            backdrop-filter: blur(12px);
        }

        .back-btn svg { width: 22px; height: 22px; fill: #fff; }

        .page-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Camera / Scanner Card */
        .scanner-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .scan-viewfinder {
            width: 100%;
            height: 240px;
            border: 2px dashed var(--accent-green);
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            position: relative;
            cursor: pointer;
            animation: viewfinderBreathe 2.6s ease-in-out infinite;
        }

        @keyframes viewfinderBreathe {
            0%, 100% { border-color: var(--accent-green); }
            50% { border-color: rgba(82, 183, 136, 0.4); }
        }

        /* Scanning laser line + live indicator, shown only while the camera feed is active */
        .scan-laser {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
            box-shadow: 0 0 12px 2px rgba(82, 183, 136, 0.8);
            animation: laserSweep 2.2s linear infinite;
            pointer-events: none;
        }

        @keyframes laserSweep {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .live-rec-dot {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .live-rec-dot::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E63946;
            animation: recBlink 1.2s ease-in-out infinite;
        }

        @keyframes recBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        /* Result card pops in instead of just appearing */
        .result-card.pop-in {
            animation: resultPop 0.4s ease-out;
        }

        @keyframes resultPop {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .scan-viewfinder svg { width: 50px; height: 50px; fill: var(--accent-green); }

        .scan-viewfinder p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Placeholder icon/text fade out once a real photo is picked */
        .scan-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            transition: opacity 0.25s ease;
        }

        .scan-viewfinder.has-photo .scan-placeholder { display: none; }

        .viewfinder-photo {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            animation: photoFadeIn 0.35s ease-out;
        }

        .scan-viewfinder.has-photo .viewfinder-photo { display: block; }

        @keyframes photoFadeIn {
            from { opacity: 0; transform: scale(1.04); }
            to { opacity: 1; transform: scale(1); }
        }

        /* "Ready to scan" badge that pops in over the picked photo */
        .photo-ready-badge {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 10px;
            align-items: center;
            gap: 5px;
            background: rgba(11, 25, 18, 0.85);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 20px;
            animation: badgePop 0.3s ease-out;
        }

        .scan-viewfinder.has-photo .photo-ready-badge { display: flex; }

        @keyframes badgePop {
            from { opacity: 0; transform: translateY(6px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .clear-photo-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(11, 25, 18, 0.75);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .clear-photo-btn:hover { background: rgba(230, 57, 70, 0.85); }
        .clear-photo-btn:active { transform: scale(0.9); }
        .scan-viewfinder.has-photo .clear-photo-btn { display: flex; }

        .upload-input {
            display: none;
        }

        .action-btns {
            display: flex;
            gap: 0.8rem;
            width: 100%;
        }

        .btn-secondary {
            flex: 1;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-primary {
            flex: 1.5;
            padding: 0.85rem;
            background: linear-gradient(135deg, #52B788, #2D6A4F);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Result Section (Hidden initially) */
        .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem;
            display: none; /* Displayed after scan */
            flex-direction: column;
            gap: 0.8rem;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .disease-badge {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .remedy-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        
          <!-- Top Navigation (Goes back to exact previous page) -->
        <div class="top-nav">
            <button type="button" class="back-btn" onclick="goBack()" title="Go Back">
                <svg viewBox="0 0 24 24"><path d="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/></svg>
            </button>
            <h1 class="page-title">AI Disease Scan</h1>
            <div style="width: 44px;"></div>
        </div>


        <!-- Scanner Card -->
        <div class="scanner-card">
    <div id="cameraContainer" style="display:none; width:100%; border-radius:18px; overflow:hidden; margin-bottom:1rem; border:2px solid var(--accent-green); position:relative;">
        <video id="webcam" autoplay playsinline style="width: 100%; height: 220px; object-fit: cover;"></video>
        <div class="scan-laser"></div>
        <div class="live-rec-dot">LIVE</div>
    </div>

    <div class="scan-viewfinder" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="scan-placeholder">
            <svg viewBox="0 0 24 24"><path d="M4,4H10V6H6V10H4V4M20,4V10H18V6H14V4H20M20,20H14V18H18V14H20V20M4,20V14H6V18H10V20H4M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7Z"/></svg>
            <p id="uploadStatus">Tap to upload leaf photo</p>
        </div>
        <img class="viewfinder-photo" id="viewfinderPhoto" alt="Selected leaf photo">
        <span class="photo-ready-badge">✓ Ready to scan</span>
        <button type="button" class="clear-photo-btn" id="clearPhotoBtn" title="Remove photo" onclick="clearPickedPhoto(event)">&times;</button>
    </div>

    <input type="file" id="fileInput" class="upload-input" accept="image/*" onchange="previewImage(event)">
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <div class="action-btns" style="flex-direction:column; gap:0.6rem;">
        <button class="btn-primary" type="button" style="width:100%; padding:0.9rem;" onclick="startLiveCamera()">📸 Scan Live Camera</button>
        <div style="display:flex; gap:0.6rem; width:100%;">
            <button class="btn-secondary" type="button" onclick="document.getElementById('fileInput').click()">Gallery</button>
            <button class="btn-primary" type="button" onclick="simulateScan()">Scan Leaf</button>
        </div>
    </div>
</div>

       <!-- Scan Output Card -->
        <div class="result-card" id="resultCard">
            <div class="result-header">
                <h3 style="font-size: 1rem; color: #fff;">Wheat Leaf Rust (پتے کا زنگ)</h3>
                <span class="disease-badge">94% Match</span>
            </div>
            <div class="remedy-box">
                <strong style="color: var(--accent-green); display: block; margin-bottom: 0.3rem;">Recommended Cure:</strong>
                Apply Propiconazole 25% EC spray (200ml per acre). Ensure proper field drainage to prevent fungal spread.
            </div>
            <!-- Refined Ask AgriVoice AI Button -->
            <button type="button" id="askAiBtn" onclick="goToAgriVoiceWithImage()" style="
                width: 100%;
                margin-top: 0.9rem;
                padding: 0.85rem 1.25rem;
                background: linear-gradient(135deg, rgba(82, 183, 136, 0.22) 0%, rgba(45, 106, 79, 0.35) 100%);
                border: 1px solid rgba(82, 183, 136, 0.45);
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
                backdrop-filter: blur(12px);
                transition: transform 0.2s ease, border-color 0.2s ease;
            ">
                <span style="display: flex; align-items: center; gap: 10px;">
                    <!-- Clean Audio/Mic Badge -->
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 11px; background: rgba(82, 183, 136, 0.18); border: 1px solid rgba(82, 183, 136, 0.35); flex-shrink: 0;">
                        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px; fill: #52B788;">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                        </svg>
                    </span>
                    <span style="display: flex; flex-direction: column; text-align: left; line-height: 1.2;">
                        <strong style="color: #ffffff; font-size: 0.92rem; font-weight: 700; letter-spacing: 0.2px;">Consult AgriVoice AI</strong>
                        <small style="color: var(--text-muted); font-size: 0.72rem; margin-top: 2px;">Ask questions about this scan</small>
                    </span>
                </span>

                <span style="
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    width: 34px;
                    height: 34px;
                    border-radius: 50%;
                    background: #52B788;
                    box-shadow: 0 4px 14px rgba(82, 183, 136, 0.45);
                    flex-shrink: 0;
                ">
                    <svg viewBox="0 0 24 24" style="width: 17px; height: 17px; fill: #0B1912;">
                        <path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
                    </svg>
                </span>
            </button>
        </div>

    </div>

    <script src="api_config.js"></script>
    <script>
        let hasImage = false;
        let videoStream = null;
        let capturedImageDataUrl = null;

        // Shrinks whatever photo was picked/captured down to a small JPEG
        // before we ever hold onto it — keeps it well under sessionStorage
        // limits and fast to hand off to AgriVoice.
        function compressImage(rawDataUrl, maxSize, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.getElementById('captureCanvas');
                const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
                canvas.width = Math.round(img.naturalWidth * scale);
                canvas.height = Math.round(img.naturalHeight * scale);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.82));
            };
            img.src = rawDataUrl;
        }

        function showPickedPhoto(dataUrl) {
            const dropZone = document.getElementById('dropZone');
            const photoEl = document.getElementById('viewfinderPhoto');
            photoEl.src = dataUrl;
            dropZone.classList.add('has-photo');
        }

        function clearPickedPhoto(event) {
            event.stopPropagation(); // don't reopen the file picker underneath
            capturedImageDataUrl = null;
            hasImage = false;
            document.getElementById('dropZone').classList.remove('has-photo');
            document.getElementById('fileInput').value = '';
            const statusText = document.getElementById('uploadStatus');
            statusText.innerText = "Tap to upload leaf photo";
            statusText.style.color = "var(--text-muted)";
            document.getElementById('resultCard').style.display = 'none';
        }

        // Grabs a single still frame from the live camera feed — used the
        // moment "Scan Leaf" is pressed while the live camera is active, so
        // a real photo (not just a video stream) can be handed to AgriVoice.
        function captureFrameFromCamera() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('captureCanvas');
            const size = 480;
            const vw = video.videoWidth || size;
            const vh = video.videoHeight || size;
            const cropSize = Math.min(vw, vh);
            const sx = (vw - cropSize) / 2;
            const sy = (vh - cropSize) / 2;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, size, size);
            return canvas.toDataURL('image/jpeg', 0.82);
        }

        async function startLiveCamera() {
            const video = document.getElementById('webcam');
            const container = document.getElementById('cameraContainer');
            const dropZone = document.getElementById('dropZone');
            const statusText = document.getElementById('uploadStatus');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = videoStream;
                container.style.display = 'block';
                dropZone.style.display = 'none';
                hasImage = true;
                statusText.innerText = "Live camera active";
                statusText.style.color = "var(--accent-green)";
            } catch (err) {
                container.style.display = 'none';
                dropZone.style.display = 'flex';
                statusText.innerText = "Camera permission denied or not supported.";
                statusText.style.color = "#EF4444";
                hasImage = false;
            }
        }

        // Central place to release the camera — called on every exit path
        // (gallery pick, scan, back button, navigating to AgriVoice, or the
        // user leaving/closing the page while the live camera is still on).
        function stopVideoStream() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function previewImage(event) {
            const statusText = document.getElementById('uploadStatus');
            const container = document.getElementById('cameraContainer');
            const dropZone = document.getElementById('dropZone');

            if (event.target.files && event.target.files.length > 0) {
                hasImage = true;
                stopVideoStream();
                container.style.display = 'none';
                dropZone.style.display = 'flex';
                statusText.innerText = "Loading photo...";
                statusText.style.color = "var(--accent-green)";

                const reader = new FileReader();
                reader.onload = (e) => {
                    compressImage(e.target.result, 480, (compressed) => {
                        capturedImageDataUrl = compressed;
                        showPickedPhoto(compressed);
                        statusText.innerText = "Photo ready to scan";
                        statusText.style.color = "var(--accent-green)";
                    });
                };
                reader.onerror = () => {
                    statusText.innerText = "Could not load that photo. Please try another.";
                    statusText.style.color = "#EF4444";
                    hasImage = false;
                };
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        let lastScanResult = { disease: 'Wheat Leaf Rust (پتے کا زنگ)', crop: 'Wheat', treatment: '' };

        async function simulateScan() {
            const resultCard = document.getElementById('resultCard');
            const statusText = document.getElementById('uploadStatus');

            if (!hasImage) {
                resultCard.style.display = 'none';
                statusText.innerText = "No image found! Please upload or capture a photo first.";
                statusText.style.color = "#EF4444";
                return;
            }

            if (videoStream && !capturedImageDataUrl) {
                capturedImageDataUrl = captureFrameFromCamera();
                document.getElementById('cameraContainer').style.display = 'none';
                document.getElementById('dropZone').style.display = 'flex';
                showPickedPhoto(capturedImageDataUrl);
            }

            statusText.innerText = "Analyzing leaf pattern...";
            statusText.style.color = "#FFD166";

            // Try backend leaf-scan API with the captured image
            try {
                if (capturedImageDataUrl) {
                    const blob = await (await fetch(capturedImageDataUrl)).blob();
                    const fd = new FormData();
                    fd.append('file', blob, 'leaf.jpg');
                    const data = await apiUpload('/api/leaf-scan', fd);
                    if (data && data.result && !data.result.error) {
                        lastScanResult = {
                            disease: data.result.disease || lastScanResult.disease,
                            crop: data.result.crop || 'Wheat',
                            treatment: data.result.treatment || '',
                            confidence: data.result.confidence || '',
                        };
                        const badge = resultCard.querySelector('.disease-badge');
                        if (badge && lastScanResult.confidence) badge.innerText = lastScanResult.confidence + ' Match';
                        const titleEl = resultCard.querySelector('h3') || resultCard.querySelector('.disease-name');
                        if (titleEl) titleEl.innerText = lastScanResult.disease;
                    }
                }
            } catch (err) {
                console.warn('Leaf scan API unavailable, using demo result:', err);
            }

            stopVideoStream();
            statusText.innerText = "Scan Complete!";
            statusText.style.color = "var(--accent-green)";
            resultCard.style.display = 'flex';
            resultCard.classList.remove('pop-in');
            void resultCard.offsetWidth;
            resultCard.classList.add('pop-in');
        }

        function goToAgriVoiceWithImage() {
            stopVideoStream();
            sessionStorage.setItem('scannedDisease', lastScanResult.disease || 'Wheat Leaf Rust (پتے کا زنگ)');
            sessionStorage.setItem('hasScannedImage', 'true');
            if (capturedImageDataUrl) {
                try {
                    sessionStorage.setItem('scannedImageData', capturedImageDataUrl);
                } catch (err) {
                    console.error('Could not carry the scanned photo over:', err);
                }
            }
            window.location.href = '06_agrivoice.html';
        }

        function goBack() {
            stopVideoStream();
            history.back();
        }

        // Safety net: release the camera if the user leaves the page any
        // other way (closing the tab, swiping away, etc.)
        window.addEventListener('pagehide', stopVideoStream);
    </script>
</body>
</html>
