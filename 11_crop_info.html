<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - Crop Information Guide</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0B1912;
            --primary-green: #2D6A4F;
            --accent-green: #52B788;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #F4F7F5;
            --text-sub: #B0C4B1;
            --badge-bg: rgba(82, 183, 136, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 110px;
        }

        .wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Top Header Navigation */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            border: 1px solid var(--card-border);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            transition: 0.2s ease;
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.18); }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Page Banner Info */
        .info-banner {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.2rem;
        }

        .info-banner h2 {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .info-banner p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0.3rem;
            line-height: 1.4;
        }

        /* Crop Selection Bar */
        .crop-selector {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.3rem;
            scrollbar-width: none;
        }
        .crop-selector::-webkit-scrollbar { display: none; }

        .crop-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .crop-btn:hover {
            border-color: var(--accent-green);
            color: #fff;
        }

        .crop-btn.active {
            background: var(--accent-green);
            color: var(--bg-dark);
            border-color: var(--accent-green);
            font-weight: 700;
        }

        /* Main Information Card */
        .info-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            box-shadow: 0 16px 36px rgba(0,0,0,0.3);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .crop-header-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .crop-icon-box {
            font-size: 2.2rem;
            background: rgba(255, 255, 255, 0.1);
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
        }

        .crop-title-text h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        .crop-title-text span {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-style: italic;
        }

        .season-tag {
            background: var(--badge-bg);
            color: var(--accent-green);
            border: 1px solid rgba(82, 183, 136, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Crop Intro Overview Paragraph */
        .crop-intro-text {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 1rem;
            border: 1px solid var(--card-border);
            font-size: 0.88rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .crop-intro-text strong {
            color: var(--text-main);
        }

        /* Key Information Specs Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .info-box-label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .info-box-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Information Blocks */
        .info-block {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            padding: 1.1rem;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .block-heading {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .block-bullets {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.6;
            padding-left: 1.2rem;
        }

        .block-bullets li {
            margin-bottom: 0.4rem;
        }

        /* Bottom Dock */
        .bottom-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background: rgba(11, 25, 18, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.7rem;
            gap: 3px;
        }

        .dock-item.active { color: var(--accent-green); }
        .dock-item svg { width: 22px; height: 22px; fill: currentColor; }

        .mic-button {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #52B788, #2D6A4F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 24px rgba(82, 183, 136, 0.5);
            cursor: pointer;
            transform: translateY(-12px);
            text-decoration: none;
        }

        .mic-button svg { width: 26px; height: 26px; fill: #fff; }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- Navigation Header -->
        <div class="header-bar">
            <a href="05_dashboard.html" class="back-link">
                ← Dashboard
            </a>
            <span class="header-title">Crop Knowledge Base</span>
        </div>

        <!-- Banner Info -->
        <div class="info-banner">
            <h2>Crops Information & Production Guide</h2>
            <p>Select any crop below to view verified agronomic specifications, sowing windows, fertilizer dosages, and disease treatment protocols for Pakistani soil conditions.</p>
        </div>

        <!-- Default Crops Tabs -->
        <div class="crop-selector" id="cropTabs">
            <button class="crop-btn" onclick="renderCropDetails('Wheat')">🌾 Wheat (گندم)</button>
            <button class="crop-btn" onclick="renderCropDetails('Cotton')">☁️ Cotton (کپاس)</button>
            <button class="crop-btn" onclick="renderCropDetails('Maize')">🌽 Maize (مکئی)</button>
            <button class="crop-btn" onclick="renderCropDetails('Sugarcane')">🎋 Sugarcane (گنا)</button>
        </div>

        <!-- Main Information Card (Populated Dynamically) -->
        <div class="info-card" id="cropDetailCard">
            <!-- Dynamic Content Injected via Script -->
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-dock">
        <a href="05_dashboard.html" class="dock-item">
            <svg viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
            <span>Home</span>
        </a>
        
        <a href="06_agrivoice.html" class="mic-button" title="AgriVoice Assistant">
            <svg viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/></svg>
        </a>

        <a href="10_profile.html" class="dock-item">
            <svg viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
            <span>Profile</span>
        </a>
    </div>

    <script>
        const CROPS_DATABASE = {
            'Wheat': {
                name: 'Wheat (گندم)',
                scientific: 'Triticum aestivum',
                emoji: '🌾',
                season: 'Rabi (حالیہ سیزن)',
                intro: 'Wheat is the premier staple food crop of Pakistan, occupying the largest cropped area in the nation. It thrives in cool winter conditions during vegetative development and requires dry, warm weather during grain maturity. Balanced potash and phosphorus application prevents lodging and optimizes grain filling.',
                sowingPeriod: '01 Nov - 30 Nov',
                harvestPeriod: '110 - 130 Days (April)',
                soilPh: '6.0 - 7.5 (Loam to Clay Loam)',
                expectedYield: '40 - 55 Mon / Acre',
                cultivation: [
                    'Perform 2-3 deep plowings followed by planking (Suhaga) to develop a firm, fine seedbed.',
                    'Use certified seed varieties (e.g., Akbar-19, Dilkash-20, Subhani-21) at 50 kg per acre.',
                    'Ensure drill sowing at 9-inch row spacing to maintain uniform plant density and aeration.'
                ],
                fertilizer: [
                    '<strong>At Sowing:</strong> Broadcast 1.5 bags DAP + 1 bag SOP (Potash) per acre.',
                    '<strong>1st Irrigation (Crown Root Stage, 21 Days):</strong> Apply 1 bag Urea.',
                    '<strong>Booting/Heading Stage:</strong> Apply remaining 1/2 bag Urea with irrigation, followed by Boron micronutrient spray.'
                ],
                diseases: [
                    '<strong>Yellow / Brown Leaf Rust (پتے کا زنگ):</strong> Appears during humid spells. Spray Propiconazole 25% EC (200 ml/acre) immediately upon first pustule sighting.',
                    '<strong>Aphids (سست تیلا):</strong> Spray Flonicamid or Imidacloprid if infestation exceeds the economic threshold at heading stage.'
                ]
            },
            'Cotton': {
                name: 'Cotton (کپاس)',
                scientific: 'Gossypium hirsutum',
                emoji: '☁️',
                season: 'Kharif Season',
                intro: 'Known as the "Silver Fiber" of Pakistan, cotton is vital for national export revenue and the textile sector. It requires deep fertile soils, moderate humidity, and structured pest monitoring against sucking insects and bollworm complexes during high heat windows.',
                sowingPeriod: '15 April - 31 May',
                harvestPeriod: '150 - 170 Days',
                soilPh: '6.5 - 8.0 (Deep Sandy Loam)',
                expectedYield: '28 - 40 Mon / Acre',
                cultivation: [
                    'Construct raised beds (kheeliya) at 2.5 feet spacing for optimum drainage and furrow irrigation.',
                    'Ensure seed delinting and fungicide treatment prior to planting at 6-8 kg/acre.',
                    'Thin seedlings within 25 days of sowing to ensure 9 to 12 inches spacing between individual plants.'
                ],
                fertilizer: [
                    '<strong>At Land Preparation:</strong> 1 bag DAP + 1 bag Potassium Sulphate (SOP).',
                    '<strong>Vegetative / Squaring Phase:</strong> Split application of 2.5 to 3 bags of Urea across 3 separate irrigations.',
                    '<strong>Peak Flowering:</strong> Foliar application of Zinc, Boron, and Magnesium Sulphate to avoid premature boll shedding.'
                ],
                diseases: [
                    '<strong>Cotton Leaf Curl Virus (CLCuV):</strong> Transmitted via Whitefly. Eradicate weeds and spray Pyriproxyfen or Spirotetramat.',
                    '<strong>Pink Bollworm (گلابی سنڈی):</strong> Install PB Ropes or Pheromone traps; spray Emamectin Benzoate during boll formation.'
                ]
            },
            'Maize': {
                name: 'Maize (مکئی)',
                scientific: 'Zea mays',
                emoji: '🌽',
                season: 'Spring / Autumn Kharif',
                intro: 'Maize produces the highest biomass and grain yield per acre among cereals in Pakistan. As a heavy nutrient feeder, it requires precise water scheduling, uninterrupted sunlight, and rapid fertilizer availability throughout the V6 to tasseling phases.',
                sowingPeriod: 'Spring: Feb-Mar | Autumn: July-Aug',
                harvestPeriod: '95 - 115 Days',
                soilPh: '6.0 - 7.2 (Well-drained Loam)',
                expectedYield: '80 - 110 Mon / Acre',
                cultivation: [
                    'Prepare loose, friable seedbeds with minimum 2 disc plowings and rotavator treatment.',
                    'Sow using pneumatic precision ridge planters at 2.25 feet row distance and 6-7 inch plant spacing.',
                    'Maintain 32,000 to 35,000 plants per acre for hybrid varieties (e.g., Pioneer, Monsanto/Bayer).'
                ],
                fertilizer: [
                    '<strong>At Sowing:</strong> 2 bags DAP + 1 bag SOP + 1 bag Ammonium Sulphate per acre.',
                    '<strong>Knee-High Stage (V6):</strong> Side-dress 1.5 bags Urea along rows before water application.',
                    '<strong>Tasseling / Cob Formation:</strong> Apply 1 bag Calcium Ammonium Nitrate (CAN) with irrigation.'
                ],
                diseases: [
                    '<strong>Fall Armyworm (فال آرمی ورم):</strong> Voracious whorl feeder. Apply Chlorantraniliprole (Coragen) or Emamectin granular bait directly in the leaf whorl.',
                    '<strong>Stem Rot / Charcoal Rot:</strong> Ensure soil does not face moisture stress during cob filling stage.'
                ]
            },
            'Sugarcane': {
                name: 'Sugarcane (گنا)',
                scientific: 'Saccharum officinarum',
                emoji: '🎋',
                season: 'Annual Crop (Rabi / Spring)',
                intro: 'Sugarcane is a long-duration commercial cash crop in Pakistan supplying the sugar manufacturing industry. It demands continuous soil moisture, heavy nitrogenous input, and strict earthing-up operations to withstand monsoon storms without lodging.',
                sowingPeriod: 'Autumn: Sep-Oct | Spring: Feb-Mar',
                harvestPeriod: '10 - 12 Months',
                soilPh: '6.5 - 7.8 (Heavy Clay Loam)',
                expectedYield: '700 - 1100 Mon / Acre',
                cultivation: [
                    'Deep chiseling to 1.5 feet depth to shatter the hardpan and allow deep root expansion.',
                    'Plant overlapping two-budded cane setts in 3.5 to 4 feet wide trenches at 40,000 to 50,000 sets per acre.',
                    'Perform earthing-up (Mitti charhana) before monsoon rains to secure cane stalks.'
                ],
                fertilizer: [
                    '<strong>Basal Dressing:</strong> 2 bags DAP + 2 bags Potash (SOP) placed directly into furrows.',
                    '<strong>Tillering Stage:</strong> Split 3 to 4 bags Urea across 4 scheduled water applications until June.',
                    '<strong>Mid-Season:</strong> Apply Zinc Sulphate (33%) 6 kg per acre to improve sucrose recovery percentage.'
                ],
                diseases: [
                    '<strong>Red Rot (سرخ سڑاند):</strong> Use certified resistant varieties (e.g., CPF-249, CP-77-400); treat setts with Carbendazim before placement.',
                    '<strong>Top Borer / Pyrilla:</strong> Apply Carbofuran 3G granules in furrows or spray Chlorpyrifos.'
                ]
            }
        };

        function renderCropDetails(cropKey) {
            // Fallback to Wheat if key is invalid
            const crop = CROPS_DATABASE[cropKey] || CROPS_DATABASE['Wheat'];

            // Update Tab active styling
            const tabButtons = document.querySelectorAll('#cropTabs .crop-btn');
            tabButtons.forEach(btn => {
                const btnText = btn.innerText.toLowerCase();
                btn.classList.toggle('active', btnText.includes(cropKey.toLowerCase()));
            });

            // Populate Main Info Card
            const card = document.getElementById('cropDetailCard');
            card.innerHTML = `
                <div class="card-top">
                    <div class="crop-header-info">
                        <div class="crop-icon-box">${crop.emoji}</div>
                        <div class="crop-title-text">
                            <h3>${crop.name}</h3>
                            <span>${crop.scientific}</span>
                        </div>
                    </div>
                    <span class="season-tag">${crop.season}</span>
                </div>

                <div class="crop-intro-text">
                    <strong>تعارف و جائزہ (Overview):</strong> ${crop.intro}
                </div>

                <div class="info-grid">
                    <div class="info-box">
                        <span class="info-box-label">Best Sowing Window</span>
                        <span class="info-box-value">${crop.sowingPeriod}</span>
                    </div>
                    <div class="info-box">
                        <span class="info-box-label">Crop Duration / Harvest</span>
                        <span class="info-box-value">${crop.harvestPeriod}</span>
                    </div>
                    <div class="info-box">
                        <span class="info-box-label">Optimal Soil pH</span>
                        <span class="info-box-value">${crop.soilPh}</span>
                    </div>
                    <div class="info-box">
                        <span class="info-box-label">Targeted Yield / Acre</span>
                        <span class="info-box-value">${crop.expectedYield}</span>
                    </div>
                </div>

                <div class="info-block">
                    <span class="block-heading">🌱 زمین کی تیاری اور طریقہ کاشت (Land Prep & Cultivation)</span>
                    <ul class="block-bullets">
                        ${crop.cultivation.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>

                <div class="info-block">
                    <span class="block-heading">🧪 کھاد کا متوازن استعمال (Fertilizer Schedule)</span>
                    <ul class="block-bullets">
                        ${crop.fertilizer.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>

                <div class="info-block">
                    <span class="block-heading">🛡️ بیماریاں اور حفاظتی تدابیر (Diseases & Crop Protection)</span>
                    <ul class="block-bullets">
                        ${crop.diseases.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        // Auto-select crop from Dashboard session or URL query
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryCrop = urlParams.get('crop');
            const savedCrop = localStorage.getItem('selectedCrop');

            const activeCrop = queryCrop || savedCrop || 'Wheat';
            renderCropDetails(activeCrop);
        });
    </script>
</body>
</html>
