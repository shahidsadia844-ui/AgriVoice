<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriPak - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2D6A4F; --accent-green: #52B788;
            --dark-bg: #0B1912; --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12); --text-light: #F4F7F5;
            --text-muted: #B0C4B1; --alert-red: #E63946;
        }

        body {
            background: linear-gradient(135deg, #0B1912 0%, #1B4332 50%, #2D6A4F 100%);
            min-height: 100vh; color: var(--text-light); font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 20px;
        }

        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }

        .header { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; }
        .back-btn { background: none; border: none; color: #fff; cursor: pointer; }
        .back-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .settings-section { display: flex; flex-direction: column; gap: 10px; }
        .section-label { font-size: 0.8rem; font-weight: 700; color: var(--accent-green); text-transform: uppercase; margin-bottom: 5px; }

        .setting-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 1.1rem; display: flex; align-items: center;
            justify-content: space-between; text-decoration: none; color: #fff;
        }
        .item-label { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
        .item-label svg { width: 20px; height: 20px; fill: var(--text-muted); }

        /* Language Toggle Toggle Styles */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.1); border-radius: 20px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(22px); }

        .danger-btn { border: 1px solid var(--alert-red); color: var(--alert-red); background: rgba(230, 57, 70, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="10_profile.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/></svg>
        </a>
        <h1 style="font-size: 1.3rem;">Settings</h1>
    </div>

    <!-- Account Settings -->
    <div class="settings-section">
        <div class="section-label">Account</div>
        <a href="03_signup.html" class="setting-card">
            <div class="item-label">
                <svg viewBox="0 0 24 24"><path d="M15,14C12.33,14 7,15.33 7,18V20H23V18C23,15.33 17.67,14 15,14M6,10V7H4V10H1V12H4V15H6V12H9V10H6M15,12A4,4 0 0,0 19,8A4,4 0 0,0 15,4A4,4 0 0,0 11,8A4,4 0 0,0 15,12Z"/></svg>
                Add Another Account
            </div>
        </a>
        <a href="14_logged_out.html" class="setting-card danger-btn">
            <div class="item-label">
                <svg viewBox="0 0 24 24" style="fill: var(--alert-red);"><path d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z"/></svg>
                Log Out
            </div>
        </a>
    </div>

    <!-- Preferences -->
    <div class="settings-section">
        <div class="section-label">Preferences</div>
        <div class="setting-card">
            <div class="item-label">Set Interface to Urdu</div>
            <label class="switch">
                <input type="checkbox" id="langSwitch" onchange="toggleSiteLang()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Hardware -->
    <div class="settings-section">
        <div class="section-label">Devices</div>
        <a href="#" class="setting-card" onclick="alert('Searching for hub via Settings...')">
            <div class="item-label">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg>
                Configure IoT Sensors
            </div>
        </a>
    </div>
</div>

<script>
    function toggleSiteLang() {
        const isChecked = document.getElementById('langSwitch').checked;
        if (isChecked) {
            alert("سائٹ اب اردو میں ہے");
            document.body.style.direction = "rtl";
        } else {
            alert("Site language reset to English");
            document.body.style.direction = "ltr";
        }
    }
</script>

</body>
</html>
